<section id="ai" class="max-w-5xl mx-auto px-4 mb-16 pt-[5%]">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for point in site.data.ai %}
    <div class="ai-point bg-white p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
      <h3 class="flex items-center gap-3 text-lg font-semibold text-gray-900 mb-3">
        <span class="pattern text-blue-400 font-mono" 
              style="{{ point.pattern-style }}"
              data-pattern="{{ point.pattern }}">
          {{ point.pattern }}
        </span>
        {{ point.title }}
      </h3>
      <div class="prose prose-sm text-gray-700">
        {{ point.text | markdownify }}
      </div>
    </div>
    {% endfor %}
  </div>
</section>
