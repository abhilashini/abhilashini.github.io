<section id="ai" class="max-w-5xl mx-auto px-4 py-8 pl-[20%] -mt-[6%] relative">
  <div class="ai-masonry-grid">
    {% assign colors = "#980027,#E3893D,#AFB242,#929CA4,#72BC9F,#E3893D" | split: "," %}
    {% for point in site.data.ai %}
    {% assign color_index = forloop.index0 | modulo: colors.size %}
    <div class="ai-masonry-item">
      <h3 data-pattern="{{ point.pattern }}" 
          style="--pattern-color: {{ colors[color_index] }}; {{ point.pattern-style | default: '' }};">
        {{ point.title }}
      </h3>
      <div class="prose text-md text-gray-800"> 
        {{ point.text | markdownify }}
      </div>
    </div>
    {% endfor %}
  </div>

  <div class="ai-animated-svg-container"> 
    <svg width="100%" height="100%" viewBox="0 0 100 300" preserveAspectRatio="xMidYMax slice">
      <defs>
        <filter id="faintGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"></feGaussianBlur>
          <feMerge>
            <feMergeNode in="blur"></feMergeNode>
            <feMergeNode in="SourceGraphic"></feMergeNode>
          </feMerge>
        </filter>
      </defs>

      {# traceR3 (Tallest Vertical, Leftmost in vertical group) - Highest horizontal position #}
      <path id="traceR3" d="M 70 10 V 276 H 20" stroke="#929CA4" stroke-width="0.8" fill="none" opacity="0.35"/>
      {# traceR2 (Medium Vertical, Middle in vertical group) - Middle horizontal position #}
      <path id="traceR2" d="M 80 50 V 283 H 35" stroke="#929CA4" stroke-width="0.8" fill="none" opacity="0.35"/>
      {# traceR1 (Shortest Vertical, Rightmost in vertical group) - Lowest horizontal position #}
      <path id="traceR1" d="M 90 100 V 290 H 50" stroke="#929CA4" stroke-width="0.8" fill="none" opacity="0.35"/>
      
      {# Circular pads #}
      {# Top-Right Pads (at vertical start points) #}
      <circle cx="70" cy="10" r="2.5" fill="none" stroke="#929CA4" stroke-width="1" opacity="0.6" filter="url(#faintGlow)"/>
      <circle cx="80" cy="50" r="2.5" fill="none" stroke="#929CA4" stroke-width="1" opacity="0.6" filter="url(#faintGlow)"/>
      <circle cx="90" cy="100" r="2.5" fill="none" stroke="#929CA4" stroke-width="1" opacity="0.6" filter="url(#faintGlow)"/>

      {# Bottom-Left Pads (at horizontal end points, adjusted for parallelism and visibility) #}
      <circle cx="20" cy="276" r="2.5" fill="none" stroke="#929CA4" stroke-width="1" opacity="0.6" filter="url(#faintGlow)"/>
      <circle cx="35" cy="283" r="2.5" fill="none" stroke="#929CA4" stroke-width="1" opacity="0.6" filter="url(#faintGlow)"/>
      <circle cx="50" cy="290" r="2.5" fill="none" stroke="#929CA4" stroke-width="1" opacity="0.6" filter="url(#faintGlow)"/>
      
      {# Animated Signal Dots #}
      <g filter="url(#faintGlow)">
        {# Durations adjusted based on new precise path lengths for consistent speed #}
        <circle r="2" fill="#14A0A9"> {# Dot for traceR3 (tallest vertical, longest overall path) #}
          <animateMotion dur="4.122s" repeatCount="indefinite">
            <mpath href="#traceR3"/>
          </animateMotion>
        </circle>
        <circle r="2" fill="#ECD1AA"> {# Dot for traceR2 (medium vertical, medium overall path) #}
          <animateMotion dur="3.624s" begin="1s" repeatCount="indefinite">
            <mpath href="#traceR2"/>
          </animateMotion>
        </circle>
        <circle r="2" fill="#E3893D"> {# Dot for traceR1 (shortest vertical, shortest overall path) #}
          <animateMotion dur="3s" begin="2s" repeatCount="indefinite">
            <mpath href="#traceR1"/>
          </animateMotion>
        </circle>
      </g>
    </svg>
  </div>

</section>
