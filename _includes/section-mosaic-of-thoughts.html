<section class="section cross-domain-heuristics">
  <div class="heuristics-bento" id="bentoContainer">

    {% for item in site.data.mosaic_of_thoughts %}
    <article class="
          heuristic-block
          type-{{ item.type }}
          {% case item.layout %}
            {% when 'wide' %}layout-2x1
            {% when 'tall' %}layout-1x2
            {% when 'large' %}layout-2x2
            {% else %}layout-1x1
          {% endcase %}
          {% if item.image %}has-image{% else %}text-only{% endif %}
        " data-index="{{ forloop.index0 }}">

      {% if item.image %}
      <div class="heuristic-media">
        <img src="{{ item.image }}" alt="" loading="lazy" />
      </div>
      {% endif %}

      {% if item.title or item.body %}
      <div class="heuristic-content">
        {% if item.title %}
        <p class="heuristic-lead">{{ item.title }}</p>
        {% endif %}
        {% if item.body %}
        <p class="heuristic-body">{{ item.body | markdownify | remove: '<p>' | remove: '</p>' }}</p>
        {% endif %}
      </div>
      {% endif %}

    </article>
    {% endfor %}

  </div>

  <button id="backToTop" class="back-to-top" aria-label="Scroll back to top">
    <span class="back-to-top-shape"></span>
    <span class="back-to-top-text">scroll <br>to top</span>
  </button>

  <div class="bento-modal" id="bentoModal" role="dialog" aria-modal="true">
    <button class="bento-modal-close" id="bentoClose" aria-label="Close">
      <span class="x-icon">×</span>
      <span class="esc-text">ESC</span>
    </button>
    <div class="bento-modal-container">
      <div class="bento-modal-inner" id="bentoModalInner"></div>
      <div class="bento-modal-controls">
        <button class="bento-nav-btn prev" id="bentoPrev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="bentoCounter">1 / n</span>
        <button class="bento-nav-btn next" id="bentoNext" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>
