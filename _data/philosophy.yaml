- heading: "The hidden price of powerful hardware"
  section: "Foundational Principles"
  text: >-
    Today's hardware readily handles complex code, but at a human cost down the line. 
    Verbosity, even if performant, often creates friction for those maintaining and 
    evolving the product. Engineering with empathy prioritises clarity and conciseness, 
    building the unseen yet essential foundation for a truly well-designed user experience.
  icon: "fas fa-scale-unbalanced"

- heading: "Design for structure, not content"
  section: "Strategic Design"
  text: >-
    Whether it's a grid of fruits or financials, the underlying structure benefits from 
    consistency. Good design and robust code avoid coupling to specific content; they 
    focus on adaptable systems that embody shared intent. This structural thinking is 
    a bridge between user needs and scalable solutions.
  icon: "fas fa-sitemap"

- heading: "SOS from SOS (Shiny Object Syndrome)"
  section: "Foundational Principles"
  text: >-
    A 10-line script often outlives 500 lines of "modern" boilerplate. 
    New tools are valuable when they demonstrably improve the experience for our 
    users or streamline the team's ability to deliver value.
  image: "/assets/images/cat-laser.gif"
  icon: "fas fa-exclamation-triangle"

- heading: "Anyone can code ≠ Everyone should"
  section: "Foundational Principles"
  text: >-
    Quick scripts are fine for personal use. In collaborative systems, hacky code 
    becomes a tax on everyone — including users. Code, like design systems, is a 
    collective artifact. It thrives on shared understanding, not isolated experiments.
  icon: "fas fa-users-slash"

- heading: "Redesign for needs, not trends"
  section: "Maintainable Systems"
  text: >-
    UX should be user-centric, not aesthetic. If users don’t struggle with 
    the existing UI, 'modernizing' it is often just theater, consuming valuable 
    engineering resources. Redesign when user feedback and data prove the current design 
    fails. Otherwise, focus on incremental tweaks, not costly overhauls.
  icon: "fas fa-user-check"

- heading: "Tests prevent silent failures"
  section: "Maintainable Systems"
  text: >-
    Tests mean more code, but ensure reliability, silently guarding user trust and 
    the product’s promised behavior. They’re systems designed to break when changes 
    stray from the agreed intent — exposing gaps before they become fractures.
  icon: "fas fa-shield-alt"

- heading: "Universal programming"
  section: "Foundational Principles"
  text: >-
    Programming’s universal grammar — logic, structure, constraints — transcends stacks.
    These principles form a lingua franca beyond languages and frameworks: a shared 
    foundation for aligning intent, adapting tools to problems (not trends), and 
    building systems that outlast their code.Complexity dissolves when we focus on 
    _**why**_ systems hold, not _**how**_ they’re built.
  icon: "fas fa-globe"

- heading: "Refactor with intent, not haste"
  section: "Maintainable Systems"
  text: >-
    Rewriting code on impulse risks breaking what users rely on. 
    Even flawed systems have hidden purpose. Refactor only 
    after tests safeguard agreed needs and plans ensure continuity for users.
  icon: "fas fa-sync-alt"

- heading: "Code with vision, not velocity"
  section: "Strategic Design"
  text: >-
    Clarity on requirements builds reusability, not just deliverables. 
    Prioritise “plug and play” systems over “patch and pray” fixes.
  icon: "fas fa-binoculars"
  comparison_table: |
    | ✅ **Plug and Play**  | | ❌ **Patch and Pray**  |
    | <img src="/assets/images/plug_n_play.gif" style="height:12rem; width:auto;" alt="Modular growth"> |   | <img src="/assets/images/patch_n_pray.gif" style="height:12rem; width:auto;" alt="Code patches multiplying like chaotic clones"> |

- heading: "System design is a map, not a maze"
  section: "Strategic Design"
  text: >-
    If a code block doesn’t trace to a user flow or data-driven need, 
    it’s noise. Codebases thrive when they embody user purpose,
    not just ***how*** they work. Good products are anchored in code 
    charted by what users seek, not just what engineers ship.
  icon: "fas fa-map"

- heading: "Code to Context, Not Frameworks"
  section: "Strategic Design"
  text: >-
    Frameworks and algorithms solve narrow problems. When they warp a 
    product’s design, users inherit quirks that compound into design debt. 
    Bend tools to user needs, never the reverse.
  code: |
    def button_label(action, device):
      if device == "screen_reader":
          return f"Press to {action}"
      return action.capitalize()
  language: "python"
  icon: "fas fa-tools"

- heading: "Maintainable systems speak human"
  section: "Maintainable Systems"
  text: >-
    When errors leave developers guessing, users suffer too. 
    Maintainability begins with empathy — for our future selves, users 
    and inheriting developers. Self-diagnosing logs and user-readable 
    errors turn debugging from scavenger hunts into guided fixes.
  icon: "fas fa-stethoscope"

- heading: "Understanding the unseen: Gestalt of knowledge"
  section: "Strategic Design"
  text: >-
    We often settle for surface-level understanding—what’s visible feels sufficient. 
    But like an iceberg, what we see is rarely the full picture. True comprehension 
    asks more: What’s beneath this? What shaped it? Without that pause, rushed 
    judgments multiply complexity instead of solving it.
  icon: "fas fa-mountain"