- layout: square
  type: title-text
  title: "The Horsepower Trap"
  body: >
     Powerful engines pull rusted wagons, but they don't fix the rust.
     Fast hardware masks design noise. The resulting friction drains human time.
     A clear "why" makes systems adaptable. 

- layout: large
  type: image-text
  body: >
    A system that meets user needs can be complete but terminal. 
    Isolate the common factors to carve a neutral core; 
    it is the difference between a one-off tool and a scalable, reusable service.
  image: "/assets/images/design_for_structure.png"

- layout: square
  type: text-only
  body: >
    Failure is rarely caused by a single bad decision. It emerges from layers of
    reasonable tradeoffs interacting under conditions no one explicitly designed for.

- layout: square
  type: text-only
  body: >
    Observability is not dashboards. It is the ability to ask new questions of your
    system without shipping new code. Systems that cannot be interrogated evolve
    blindly, guided more by superstition than evidence.

- layout: wide
  type: image-text
  body: >
    Users experience delay as uncertainty. Even when throughput is acceptable,
    long-tail latency erodes trust and amplifies perceived instability.
  image: "https://placehold.co/900x400"

- layout: square
  type: title-text
  title: "Latency is a product feature"
  body: >
    Performance is not an implementation detail. It is part of the user contract,
    shaping how reliable and predictable a system feels under real conditions.

- layout: square
  type: image-only
  image: "https://placehold.co/600x600"

- layout: tall
  type: image-title
  title: "Design for recovery, not perfection"
  image: "https://placehold.co/600x900"

- layout: square
  type: text-only
  body: >
    Improving performance in isolation often shifts complexity elsewhere.
    Always reason about the system boundary where incentives diverge.

- layout: square
  type: image-title-text
  title: "Human workflows are part of the system"
  body: >
    Alert fatigue, handoffs, and institutional knowledge gaps shape behavior
    as much as code paths do. Ignoring them creates invisible failure modes.
  image: "https://placehold.co/600x400"

- layout: square
  type: text-only
  body: >
    What you measure becomes what the system optimizes for,
    even when the metric stops representing the underlying goal.

- layout: large
  type: image-text
  body: >
    Growth does not introduce new problems so much as it magnifies
    the ones that were quietly tolerated before. Scale is a stress test
    for assumptions, not a feature milestone.
  image: "https://placehold.co/1000x800"

- layout: square
  type: title-only
  title: "Scale exposes assumptions."