- layout: square
  type: title-text
  title: "runtime cost ≠ system cost"
  body: >
    Better hardware can mask noisy code for a long time.
    The cost becomes visible when the system needs to evolve.

- layout: square
  type: image-text
  body: >
    Some ideas are clearer when they are shown.
    Some are clearer when they are said.
    The form should follow the idea.
  image: "/assets/images/picture_not_worth_words.png"

- layout: wide
  type: image-only
  image: "/assets/images/shiny_object_syndrome.png"

- layout: tall
  type: title-text
  title: "Understanding comes before optimisation"
  body: >
    Some complexity is accidental. Some complexity is earned.
    What looks tangled from the outside may be the shape of things being brought together.
    Something that needs simplification may not have been understood yet.

- layout: wide
  type: image-text
  body: >
    [TK]Users experience delay as uncertainty. Even when throughput is acceptable,
    long-tail latency erodes trust and amplifies perceived instability.
  image: "https://placehold.co/900x400"

- layout: large
  type: image-text
  body: >
    A system that meets user needs can be complete but terminal. 
    Isolate the common factors to carve a neutral core; 
    it is the difference between a one-off tool and a scalable, reusable service.
  image: "/assets/images/design_for_structure.png"

- layout: square
  type: image-only
  image: "https://placehold.co/600x600"

- layout: tall
  type: image-title
  title: "Computation scales more easily than coordination"
  image: "/assets/images/computation_vs_coordination.jpg"

- layout: square
  type: text-only
  body: >
    Improving performance in isolation often shifts complexity elsewhere.
    Always reason about the system boundary where incentives diverge.

- layout: square
  type: image-title-text
  title: "Human workflows are part of the system"
  body: >
    Alert fatigue, handoffs, and institutional knowledge gaps shape behavior
    as much as code paths do. Ignoring them creates invisible failure modes.
  image: "https://placehold.co/600x400"

- layout: square
  type: text-only
  body: >
    Effort can make a path feel more necessary than it is.
    We get better at improving a path, and sometimes forget to ask whether it is still the path we want.

- layout: large
  type: image-text
  body: >
    Growth does not introduce new problems so much as it magnifies
    the ones that were quietly tolerated before. Scale is a stress test
    for assumptions, not a feature milestone.
  image: "https://placehold.co/1000x800"

- layout: square
  type: title-only
  title: "Friction reveals hidden structure."